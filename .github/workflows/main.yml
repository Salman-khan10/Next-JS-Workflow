name: Next JS Build With Caching and Artifact

on: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout Repository
        uses: actions/checkout@v6.0.2
        
      - name: setup node js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: 'npm'

       - name: install dependencies
         run: npm install

       - name: Build NexJS App
         run: npm run build

       - name: Upload Build on Artifact
         uses: actions/upload-artifact@v7.0.1
         with:
           name: nextjs-build
           path: out/
        
