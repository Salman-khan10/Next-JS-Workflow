name: Next JS Build With Caching and Artifact

on: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6.0.2

      - name: setup node js
        uses: actions/setup-node@v6.4.0
        with:
          nodejs-version: 22.x
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: next js build
        run: npm run build
        
      - name: upload build on artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nextjs-build
          path: out/
